packages: []

# 强制全仓只用一份 Vue，修复 reka-ui SSR：Cannot read properties of null (reading 'ce')
overrides:
  vue: 3.5.45
  '@vue/compiler-core': 3.5.45
  '@vue/compiler-dom': 3.5.45
  '@vue/compiler-sfc': 3.5.45
  '@vue/compiler-ssr': 3.5.45
  '@vue/reactivity': 3.5.45
  '@vue/runtime-core': 3.5.45
  '@vue/runtime-dom': 3.5.45
  '@vue/server-renderer': 3.5.45
  '@vue/shared': 3.5.45

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
  vue-demi: true

catalogs:
  build:
    '@nuxt/devtools': ^3.0.0-beta.2
    '@nuxt/eslint': ^1.9.0
    '@nuxt/kit': ^4.2.0
    '@nuxtjs/color-mode': ^3.5.2
    '@pinia/nuxt': ^0.11.2
    '@vite-pwa/nuxt': ^1.0.7
    '@vueuse/nuxt': ^14.0.0
    nuxt: ^4.2.0
    unplugin: ^2.3.10
    vite: ^7.1.12
  dev:
    '@antfu/eslint-config': ^6.1.0
    eslint: ^9.38.0
    eslint-plugin-format: ^1.0.2
    typescript: ^5.9.3
    vue-tsc: ^3.1.2
  frontend:
    '@vueuse/core': ^14.1.0
    pinia: ^3.0.3
    # 与 Nuxt 4.6 自带的 vue@3.5.45 对齐，避免 SSR 打进双份 runtime-core
    vue: 3.5.45
  icons:
    '@iconify-json/carbon': ^1.2.14
    '@iconify-json/twemoji': ^1.2.4
